[project]
name = "catseye-python"
version = "0.1.0"
description = "A python program to visualize and process images of the eye to isolate vessel data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "briefcase>=0.4.2",
    "nuitka>=4.1.3",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.2.0",
    "wxpython>=4.2.5",
    "onnxruntime>=1.27.0",
    "pystackreg>=0.2.8",
#    "ultralytics>=8.4.92",
]

[dependency-groups]
dev = [
#    "toga>=0.5.4",
#    "ultralytics>=8.4.70",
]


[project.scripts]
GUI_test = "GUI:GUI"
CLI = "main:_run_cli"

